bio: |
  I am a PhD researcher at the University of Canterbury in Christchurch, New Zealand.
  My research focuses on the development of energy system models for the analysis of net-zero energy systems. 
  I am particularly interested in the island energy systems, integration of renewable energies, energy storage systems and sector coupling.

